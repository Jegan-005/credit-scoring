<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Details - CredX AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>

<div class="centered-form-container">
  <div class="centered-form-box financial-form-box">
    <div class="form-header">
      <h1>CredX AI</h1>
      <h2>Financial Details</h2>
    </div>

    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}

    <form method="post" class="centered-form">
      <div class="form-group">
        <label>Age</label>
        <input type="number" name="age" required min="18" max="80" 
               value="{{ data.age if data else '' }}">
      </div>

      <div class="form-group">
        <label>Monthly Income (₹)</label>
        <input type="number" name="income" required min="10000" 
               value="{{ data.income if data else '' }}">
      </div>

      <div class="form-group">
        <label>Existing Loans</label>
        <input type="number" name="existing_loans" required min="0" max="10"
               value="{{ data.existing_loans if data else '0' }}">
      </div>

      <div class="form-group">
        <label>Total EMI Amount (₹)</label>
        <input type="number" name="total_emi" required min="0"
               value="{{ data.total_emi if data else '0' }}">
      </div>

      <div class="form-group">
        <label>Credit Utilization (%)</label>
        <input type="number" name="credit_utilization" required min="0" max="100" step="0.1"
               value="{{ data.credit_utilization if data else '30' }}">
      </div>

      <div class="form-group">
        <label>Number of Missed Payments</label>
        <input type="number" name="defaults" required min="0"
               value="{{ data.defaults if data else '0' }}">
      </div>

      <button type="submit" class="btn primary full-width">Submit</button>
    </form>

    <div class="form-footer">
      <a href="/logout">Logout</a>
    </div>
  </div>
</div>

</body>
</html>
