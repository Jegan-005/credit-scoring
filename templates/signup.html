<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - CredX AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>

<div class="centered-form-container">
  <div class="centered-form-box">
    <div class="form-header">
      <h1>CredX AI</h1>
      <h2>Sign Up</h2>
    </div>

    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}

    <form method="post" class="centered-form" id="signupForm">
      <div class="form-group">
        <input type="text" name="username" placeholder="Username" required minlength="3">
      </div>

      <div class="form-group">
        <input type="email" name="email" placeholder="Email Address" required>
      </div>

      <div class="form-group">
        <input type="password" name="password" placeholder="Password" required minlength="6">
      </div>

      <div class="form-group">
        <input type="password" name="confirm_password" placeholder="Confirm Password" required>
      </div>

      <div class="form-group">
        <label class="checkbox-container">
          <input type="checkbox" required>
          <span class="checkmark"></span>
          I agree to the Terms of Service and Privacy Policy
        </label>
      </div>

      <button type="submit" class="btn primary full-width">Sign Up</button>
    </form>

    <div class="form-footer">
      <p>Already have an account? <a href="/login">Login</a></p>
      <a href="/">Back to Home</a>
    </div>
  </div>
</div>

<script>
// Form validation
document.getElementById('signupForm').addEventListener('submit', function(e) {
  const password = document.querySelector('input[name="password"]').value;
  const confirmPassword = document.querySelector('input[name="confirm_password"]').value;
  
  if (password !== confirmPassword) {
    e.preventDefault();
    alert('Passwords do not match');
    return;
  }
});
</script>

</body>
</html>
